name: "🔗 Downstream Activity"
description: Track a follow-up action a workstream runs after a website change goes live (e.g. Outreach LinkedIn post).
title: "[Downstream][<workstream>] "
labels: ["type: downstream", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open this when a website milestone unblocks work for your workstream — for example, the registration
        portal goes live and **Advertising & Outreach** starts LinkedIn posts. Link it back to the change that
        triggered it so nothing is lost when the original request is closed.

        See the [WORKSTREAM_PLAYBOOK](../../blob/main/.github/WORKSTREAM_PLAYBOOK.md) for the standard triggers.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      description: Confirm you've searched before submitting.
      options:
        - label: I searched existing open and closed issues and did not find this downstream activity already tracked.
          required: true

  - type: dropdown
    id: workstream
    attributes:
      label: Owning workstream
      description: Who runs this activity?
      options:
        - Advertising & Outreach
        - Sponsorship
        - Conference Website
        - Theme & Session Planning
        - Speaker & Instructor Invitation
        - Conference Venue
        - 2028 Venue Research
    validations:
      required: true

  - type: input
    id: trigger
    attributes:
      label: Triggered by
      description: The issue number of the website change that unblocks this (e.g. "#42"). Leave blank if none.
      placeholder: "#42"
    validations:
      required: false

  - type: textarea
    id: activity
    attributes:
      label: Activity to run
      description: What will you do, and where?
      placeholder: |
        Publish LinkedIn "Registration is open" post + schedule 2 reminder posts.
        Draft link: ...
    validations:
      required: true

  - type: input
    id: due
    attributes:
      label: Target date
      placeholder: "2026-09-02 or 'when trigger closes'"
    validations:
      required: false
