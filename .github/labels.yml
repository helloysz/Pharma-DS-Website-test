# Label definitions for the PharmaDS 2027 website-update workflow.
# Create/update them in the repo with: bash scripts/setup-labels.sh
# Colors are 6-digit hex (no leading #).

# --- Workstream (who owns / requested the work) ---
- name: "ws: venue"
  color: "1f6feb"
  description: "Conference Venue workstream"
- name: "ws: theme-session"
  color: "8250df"
  description: "Theme & Session Planning workstream"
- name: "ws: speakers"
  color: "bf3989"
  description: "Speaker & Instructor Invitation workstream"
- name: "ws: website"
  color: "0e8a16"
  description: "Conference Website workstream (implementer/maintainer)"
- name: "ws: outreach"
  color: "d93f0b"
  description: "Advertising & Outreach workstream"
- name: "ws: sponsorship"
  color: "fbca04"
  description: "Sponsorship workstream"
- name: "ws: 2028-venue"
  color: "5319e7"
  description: "2028 Venue Research workstream"

# --- Type of request ---
- name: "type: content"
  color: "0052cc"
  description: "Page content update"
- name: "type: topic"
  color: "1d76db"
  description: "Idea / feedback / topic to explore"
- name: "type: formatting"
  color: "c5def5"
  description: "Layout / color / styling fix"
- name: "type: downstream"
  color: "e99695"
  description: "Follow-up activity triggered by a website change"

# --- Status (lifecycle of a request; open = pending, closed = live/handled) ---
- name: "status: needs-triage"
  color: "ededed"
  description: "New request, not yet reviewed"
- name: "status: needs-content"
  color: "fef2c0"
  description: "Waiting on final copy/assets from the workstream"
- name: "status: ready-to-build"
  color: "c2e0c6"
  description: "Content is ready; website team can start"
- name: "status: in-progress"
  color: "bfd4f2"
  description: "Website team is actively building"
- name: "status: needs-review"
  color: "d4c5f9"
  description: "Built; awaiting workstream sign-off"
- name: "status: live"
  color: "0e8a16"
  description: "Change is live on the site (close the issue)"

# --- Priority ---
- name: "priority: high"
  color: "b60205"
  description: "Blocking / time-sensitive"
- name: "priority: medium"
  color: "fbca04"
  description: "Needed soon"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"
